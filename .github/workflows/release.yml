name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Verify managed fingerprint kernel
        shell: pwsh
        run: |
          $kernelUrl = 'https://github.com/adryfish/fingerprint-chromium/releases/download/148.0.7778.215/ungoogled-chromium_148.0.7778.215-1.1_windows_x64.zip'
          $expectedHash = '9ef3f471b7a6641b4224532522b29141ce3746e27d55788d88e2fd951f362579'
          $archive = Join-Path $env:RUNNER_TEMP 'fingerprint-chromium.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'fingerprint-chromium'

          Invoke-WebRequest -Uri $kernelUrl -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Fingerprint kernel checksum mismatch: $actualHash"
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $chrome = Get-ChildItem -LiteralPath $destination -Recurse -File -Filter chrome.exe | Select-Object -First 1
          if (-not $chrome) { throw 'Fingerprint kernel archive does not contain chrome.exe' }

      - name: Build application
        run: npm run build

      - name: Smoke test Electron startup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $env:FINGERBROWSER_SMOKE_TEST = '1'
          $env:FINGERBROWSER_SMOKE_SCREENSHOT = (Join-Path $PWD 'artifacts/ui-smoke.png')
          npx electron .
          if ($LASTEXITCODE -ne 0) { throw "Electron smoke test exited with $LASTEXITCODE" }
          $screenshots = @(Get-ChildItem -LiteralPath artifacts -File -Filter 'ui-*.png')
          if ($screenshots.Count -ne 5) {
            throw "Electron smoke test created $($screenshots.Count) screenshots; expected 5"
          }

      - name: Upload smoke screenshot
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke-${{ github.ref_name }}
          path: artifacts/ui-*.png
          retention-days: 7

      - name: Package Windows application
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create checksums
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -LiteralPath release -File | Where-Object {
            $_.Extension -in @('.exe', '.zip')
          })

          if ($assets.Count -eq 0) {
            throw 'electron-builder did not produce any release assets'
          }

          $checksums = $assets | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }

          $checksums | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath release -File | Where-Object {
            $_.Extension -in @('.exe', '.zip')
          } | ForEach-Object { $_.FullName })
          $assets += (Resolve-Path -LiteralPath release/SHA256SUMS.txt).Path

          $notes = @"
          FingerBrowser $env:GITHUB_REF_NAME Windows release.

          - The fingerprint Chromium binary is not bundled in the installer. The app can download, verify, and install the pinned official build from Settings.
          - Profile notes are visible and editable from the main environment table.
          - The profile manager and editor now use a compact operations-focused layout without ads or commercial surfaces.
          - An original app and installer icon plus a custom startup transition replace the Electron defaults.
          - The installer is not code-signed yet, so Windows SmartScreen may show an unknown publisher warning.
          - This is an MVP release without automated fingerprint-consistency guarantees.
          "@

          gh release create $env:GITHUB_REF_NAME @assets `
            --verify-tag `
            --title "FingerBrowser $env:GITHUB_REF_NAME" `
            --notes $notes
