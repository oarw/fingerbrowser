name: auto-release

on:
  workflow_call:
    inputs:
      release_tag:
        description: Prerelease tag calculated by the build job
        required: true
        type: string
      target_sha:
        description: Commit verified by the build job
        required: true
        type: string
      is_prerelease:
        description: Publish as a GitHub pre-release instead of the latest stable release
        required: true
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download verified Windows packages
        uses: actions/download-artifact@v7
        with:
          name: fingerbrowser-windows
          path: ${{ runner.temp }}/release

      - name: Verify assets and create checksums
        shell: bash
        env:
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          mapfile -d '' assets < <(find "$RELEASE_DIR" -maxdepth 1 -type f \( -name '*.exe' -o -name '*.zip' \) -print0)
          if (( ${#assets[@]} == 0 )); then
            echo 'The build did not provide any Windows release assets' >&2
            exit 1
          fi

          : > "$RELEASE_DIR/SHA256SUMS.txt"
          for asset in "${assets[@]}"; do
            hash="$(sha256sum "$asset" | cut -d ' ' -f 1)"
            printf '%s  %s\n' "$hash" "$(basename "$asset")" >> "$RELEASE_DIR/SHA256SUMS.txt"
          done
          sort -k 2 -o "$RELEASE_DIR/SHA256SUMS.txt" "$RELEASE_DIR/SHA256SUMS.txt"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DIR: ${{ runner.temp }}/release
          RELEASE_TAG: ${{ inputs.release_tag }}
          IS_PRERELEASE: ${{ inputs.is_prerelease }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          mapfile -d '' assets < <(find "$RELEASE_DIR" -maxdepth 1 -type f \( -name '*.exe' -o -name '*.zip' \) -print0)
          assets+=("$RELEASE_DIR/SHA256SUMS.txt")
          release_options=(
            --repo "$GITHUB_REPOSITORY"
            --target "$TARGET_SHA"
            --title "FingerBrowser $RELEASE_TAG"
            --generate-notes
            --fail-on-no-commits
          )
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_options+=(--prerelease --latest=false)
          else
            release_options+=(--latest)
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" "${release_options[@]}"
