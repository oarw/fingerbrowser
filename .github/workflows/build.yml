name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      release_tag: ${{ steps.release_version.outputs.release_tag }}
      release_prerelease: ${{ steps.release_version.outputs.release_prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Prepare automatic release version
        id: release_version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $releaseVersion = (git tag --list | node scripts/next-release.mjs $packageVersion).Trim()
          if (-not $releaseVersion) { throw 'Unable to determine the next release version' }
          npm pkg set "version=$releaseVersion"
          if ($LASTEXITCODE -ne 0) { throw "npm pkg set exited with $LASTEXITCODE" }
          "release_tag=v$releaseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $isPrerelease = $releaseVersion -match '-pre\.\d+$'
          "release_prerelease=$($isPrerelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Build renderer/main/preload
        run: npm run build

      - name: Smoke test Electron startup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $env:FINGERBROWSER_SMOKE_TEST = '1'
          $env:FINGERBROWSER_SMOKE_SCREENSHOT = (Join-Path $PWD 'artifacts/ui-smoke.png')
          npx electron .
          if ($LASTEXITCODE -ne 0) { throw "Electron smoke test exited with $LASTEXITCODE" }
          $screenshots = @(Get-ChildItem -LiteralPath artifacts -File -Filter 'ui-*.png')
          if ($screenshots.Count -ne 10) {
            throw "Electron smoke test created $($screenshots.Count) screenshots; expected 10"
          }

      - name: Upload smoke screenshot
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke
          path: artifacts/ui-*.png
          retention-days: 7

      - name: Package (electron-builder, Windows)
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: fingerbrowser-windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: warn

  auto-release:
    name: Auto release
    needs: build-windows
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build-windows.outputs.release_tag != ''
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/auto-release.yml
    with:
      release_tag: ${{ needs.build-windows.outputs.release_tag }}
      is_prerelease: ${{ needs.build-windows.outputs.release_prerelease == 'true' }}
      target_sha: ${{ github.sha }}
