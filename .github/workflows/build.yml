name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Build renderer/main/preload
        run: npm run build

      - name: Smoke test Electron startup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $env:FINGERBROWSER_SMOKE_TEST = '1'
          $env:FINGERBROWSER_SMOKE_SCREENSHOT = (Join-Path $PWD 'artifacts/ui-smoke.png')
          npx electron .
          if ($LASTEXITCODE -ne 0) { throw "Electron smoke test exited with $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $env:FINGERBROWSER_SMOKE_SCREENSHOT)) {
            throw 'Electron smoke test did not create a screenshot'
          }

      - name: Upload smoke screenshot
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke
          path: artifacts/ui-smoke.png
          retention-days: 7

      - name: Package (electron-builder, Windows)
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: fingerbrowser-windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: warn
