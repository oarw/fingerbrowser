appId: com.fingerbrowser.app
productName: FingerBrowser
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
mac:
  target:
    - dmg
    - zip
  category: public.app-category.utilities
linux:
  target:
    - AppImage
  category: Utility
